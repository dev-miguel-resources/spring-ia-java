version: "3.8"
services:
  # el servicio es la forma en la que el docker compose reconoce tus apps dentro del compose
  postgres_db:
    container_name: "postgres_db"
    image: "postgres:16-alpine"
    env_file: ./.env
    ports:
      - ${DB_LOCAL_PORT}:${DB_DOCKER_PORT}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:${DB_VOLUME_URL}
  
  chroma_db:
    container_name: "chroma_db"
    image: "ghcr.io/chroma-core/chroma:1.0.0"
    env_file: ./.env
    ports:
      - ${CHROMA_LOCAL_PORT}:${CHROMA_DOCKER_PORT}
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=true

volumes:
  postgres-data:
  chroma_data:

